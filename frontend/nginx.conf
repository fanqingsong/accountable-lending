server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Container listens on 80; host publishes 8080. Absolute redirects
    # would send the browser to http://localhost/lending/ (port 80).
    absolute_redirect off;

    location = / {
        return 302 /lending/;
    }

    location /lending {
        try_files $uri $uri/ /lending/index.html;
    }

    # Same-origin JSON so the browser does not call localhost:8001
    # (that origin list breaks WSL / LAN hostnames).
    location /api/lending/ {
        proxy_pass http://lending-api:8001/api/lending/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_send_timeout 240s;
        proxy_read_timeout 240s;
        client_max_body_size 32m;
    }
}
