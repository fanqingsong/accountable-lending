<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>图谱问答</title>
  <!--
    Three variants of the agent chat page, switchable via ?variant=,
    on the existing /lending/chat route.
    A = Audit desk   B = Cited transcript   C = Case briefing
  -->
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { color: #1a1a1a; }
    a { color: inherit; }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    textarea { resize: none; }
    .hidden { display: none !important; }

    /* —— Prototype switcher (not part of the designs) —— */
    .switcher {
      position: fixed; z-index: 40; left: 50%; bottom: 16px; transform: translateX(-50%);
      display: flex; align-items: center; gap: 8px;
      padding: 8px 10px; border-radius: 999px;
      background: #111; color: #f4f4f4; box-shadow: 0 8px 24px rgba(0,0,0,.28);
      font: 12px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .switcher button {
      width: 28px; height: 28px; border: 0; border-radius: 50%;
      background: #333; color: #fff;
    }
    .switcher .label { min-width: 16rem; text-align: center; }
    .switcher .state { opacity: .65; }

    /* ================= A — Audit desk ================= */
    .a { min-height: 100%; background: #e7e2d6; font-family: "Iowan Old Style", Georgia, serif; }
    .a a { color: #1e3a5f; }
    .a-top {
      display: flex; justify-content: space-between; align-items: baseline;
      padding: 14px 22px 10px; border-bottom: 1px solid #cfc6b4;
    }
    .a-top h1 { margin: 0; font-size: 1.25rem; letter-spacing: .02em; }
    .a-top nav { font-family: sans-serif; font-size: .8rem; }
    .a-grid { display: grid; grid-template-columns: 1.15fr .85fr; height: calc(100vh - 58px); }
    .a-thread { display: flex; flex-direction: column; border-right: 1px solid #cfc6b4; }
    .a-log { flex: 1; overflow: auto; padding: 18px 22px 8px; }
    .a-turn { margin: 0 0 1.25rem; }
    .a-q { font-family: sans-serif; font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: #5c5346; }
    .a-a { margin: .4rem 0 0; font-size: 1.05rem; line-height: 1.5; }
    .a-cites { display: flex; flex-wrap: wrap; gap: 6px; margin-top: .55rem; font-family: sans-serif; }
    .a-cites button {
      border: 1px solid #1e3a5f; background: transparent; color: #1e3a5f;
      padding: .15rem .45rem; font-size: .72rem;
    }
    .a-cites button.on { background: #1e3a5f; color: #f7f3ea; }
    .a-composer { padding: 12px 22px 72px; border-top: 1px solid #cfc6b4; background: #efe9dc; }
    .a-composer textarea { width: 100%; min-height: 3.2rem; padding: .5rem; border: 1px solid #b9b09d; background: #f7f3ea; }
    .a-composer .row { display: flex; justify-content: space-between; align-items: center; margin-top: .5rem; }
    .a-composer button[type=submit] { background: #1e3a5f; color: #fff; border: 0; padding: .4rem 1rem; }
    .a-empty { color: #5c5346; font-size: 1.05rem; max-width: 22rem; }
    .a-panel { overflow: auto; padding: 16px 18px 80px; background: #f4efe4; }
    .a-panel h2 { margin: 0 0 .75rem; font-size: 1rem; }
    .a-src { font-family: sans-serif; font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: #8b2942; }
    .a-step { position: relative; padding: 0 0 1rem 1rem; border-left: 2px solid #1e3a5f; }
    .a-step:last-child { border-left-color: transparent; }
    .a-step b { display: block; font-size: .95rem; }
    .a-step p { margin: .25rem 0 0; font-family: sans-serif; font-size: .85rem; color: #3d372e; }
    .a-hit, .a-ent { font-family: sans-serif; font-size: .82rem; border: 1px solid #cfc6b4; padding: .55rem .7rem; margin: .45rem 0; background: #f7f3ea; }
    .a-hit.hl, .a-step.hl, .a-ent.hl { outline: 2px solid #8b2942; }
    .a-meta { color: #6a6154; font-size: .72rem; }

    /* ================= B — Cited transcript ================= */
    .b { min-height: 100%; background: #f6f7f9; font-family: "Segoe UI", system-ui, sans-serif; }
    .b a { color: #0b57d0; }
    .b-shell { max-width: 46rem; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }
    .b-nav { padding: 14px 16px 0; font-size: .85rem; }
    .b-log { flex: 1; padding: 20px 16px 8px; }
    .b-hero { text-align: center; padding: 4.5rem 1rem 2rem; }
    .b-hero h1 { margin: 0 0 .6rem; font-size: 1.8rem; font-weight: 650; }
    .b-hero p { margin: 0 auto 1.4rem; max-width: 28rem; color: #5c6570; }
    .b-chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
    .b-chips button, .b-cite {
      border: 1px solid #d5dbe3; background: #fff; border-radius: 999px;
      padding: .4rem .8rem; color: #1a1a1a;
    }
    .b-msg { display: flex; margin: 1rem 0; }
    .b-msg.user { justify-content: flex-end; }
    .b-bubble { max-width: 85%; padding: .85rem 1rem; border-radius: 18px; line-height: 1.5; }
    .b-msg.user .b-bubble { background: #1a1a1a; color: #fff; border-bottom-right-radius: 6px; }
    .b-msg.assistant .b-bubble { background: #fff; border: 1px solid #e4e8ee; border-bottom-left-radius: 6px; box-shadow: 0 1px 2px rgba(16,24,40,.04); }
    .b-src { display: inline-block; margin-bottom: .35rem; font-size: .7rem; color: #667085; letter-spacing: .04em; text-transform: uppercase; }
    .b-cites { display: flex; flex-wrap: wrap; gap: 6px; margin-top: .65rem; }
    .b-cite { font-size: .75rem; padding: .2rem .55rem; }
    .b-cite.on, .b-cite[aria-expanded=true] { background: #e8f0fe; border-color: #0b57d0; color: #0b57d0; }
    .b-card { flex-basis: 100%; margin-top: .15rem; padding: .7rem .8rem; background: #f8fafc; border-radius: 10px; font-size: .85rem; color: #344054; }
    .b-composer {
      position: sticky; bottom: 0; padding: 8px 16px 72px; background: linear-gradient(transparent, #f6f7f9 24%);
    }
    .b-box {
      display: flex; gap: 8px; align-items: flex-end;
      background: #fff; border: 1px solid #d5dbe3; border-radius: 16px; padding: 8px 8px 8px 12px;
      box-shadow: 0 8px 24px rgba(16,24,40,.06);
    }
    .b-box textarea { flex: 1; border: 0; outline: none; min-height: 2.4rem; max-height: 8rem; }
    .b-box button { border: 0; background: #0b57d0; color: #fff; border-radius: 12px; padding: .55rem .9rem; }

    /* ================= C — Case briefing ================= */
    .c { min-height: 100%; background: #12141a; color: #e6e1d4; font-family: "IBM Plex Sans", "Segoe UI", sans-serif; }
    .c a { color: #e8b86d; }
    .c-layout { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
    .c-rail { padding: 16px 14px 80px; border-right: 1px solid #2a2e38; background: #0e1015; }
    .c-rail h1 { margin: 0 0 .2rem; font-size: .95rem; font-weight: 600; }
    .c-rail .sub { font-size: .72rem; color: #8b8476; margin-bottom: 1rem; }
    .c-case {
      display: block; width: 100%; text-align: left; margin: 0 0 6px;
      background: transparent; color: #e6e1d4; border: 1px solid #2a2e38; padding: .55rem .6rem;
    }
    .c-case.on { border-color: #e8b86d; background: #1b1810; }
    .c-case small { display: block; color: #8b8476; font-family: ui-monospace, Menlo, monospace; }
    .c-hist { margin-top: 1.25rem; }
    .c-hist button {
      display: block; width: 100%; text-align: left; background: none; border: 0;
      color: #b7b0a2; padding: .3rem 0; font-size: .8rem;
    }
    .c-main { display: flex; flex-direction: column; min-width: 0; min-height: 100vh; overflow: auto; }
    .c-nav { padding: 14px 22px 0; font-size: .8rem; color: #8b8476; }
    .c-hero { padding: 28px 28px 8px; }
    .c-kicker { font-family: ui-monospace, Menlo, monospace; font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: #e8b86d; }
    .c-outcome { margin: .35rem 0 0; font-size: 2.1rem; font-weight: 650; letter-spacing: -.03em; }
    .c-answer { padding: 8px 28px 0; font-size: 1.05rem; line-height: 1.55; max-width: 46rem; }
    .c-chain { display: flex; flex-wrap: wrap; gap: 8px; padding: 18px 28px 0; }
    .c-node { flex: 1; min-width: 10rem; border: 1px solid #2a2e38; padding: .7rem .8rem; background: #181b23; }
    .c-node em { display: block; font-style: normal; font-size: .7rem; color: #8b8476; font-family: ui-monospace, Menlo, monospace; }
    .c-table { width: calc(100% - 56px); margin: 18px 28px 0; border-collapse: collapse; font-size: .82rem; }
    .c-table th, .c-table td { border-bottom: 1px solid #2a2e38; padding: .5rem .4rem; text-align: left; vertical-align: top; }
    .c-table th { color: #8b8476; font-weight: 500; }
    .c-table td:last-child { max-width: 36rem; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .c-ents { display: flex; flex-wrap: wrap; gap: 6px; padding: 14px 28px 0; }
    .c-ents span { border: 1px solid #3a3428; color: #e8b86d; padding: .15rem .45rem; font-size: .75rem; }
    .c-cmd { position: sticky; bottom: 0; margin-top: auto; padding: 14px 28px 80px; background: linear-gradient(transparent, #12141a 28%); }
    .c-cmd label { display: block; font-family: ui-monospace, Menlo, monospace; font-size: .75rem; color: #8b8476; margin-bottom: .4rem; }
    .c-line {
      display: flex; align-items: center; gap: 8px;
      border: 1px solid #3a3428; background: #0e1015; padding: .55rem .7rem;
    }
    .c-line span { color: #e8b86d; font-family: ui-monospace, Menlo, monospace; }
    .c-line input { flex: 1; border: 0; background: transparent; color: #e6e1d4; outline: none; }
    .c-empty { padding: 4rem 28px; color: #8b8476; max-width: 28rem; }

    .wait { opacity: .7; font-style: italic; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div class="switcher" role="group" aria-label="原型切换">
    <button type="button" data-dir="-1" aria-label="上一个方案">←</button>
    <div class="label">
      <div id="switch-name">A — 审计台</div>
      <div class="state" id="switch-state">turns 0</div>
    </div>
    <button type="button" data-dir="1" aria-label="下一个方案">→</button>
  </div>

  <noscript>
    <p><a href="/">知识图谱</a> · <a href="/lending">导入案件</a> · <a href="/lending/retrieve">图谱检索</a> · <a href="/lending/ontology">本体</a></p>
    <h1>图谱问答</h1>
    <p>先检索图谱，再用模型写成一段话。模型不能改抽取、规则或决策。</p>
    <form method="post" action="/lending/chat">
      <label>问题 <input type="text" name="query" value="{{query}}" required /></label>
      <button>提问</button>
    </form>
    {{answer}}
    {{results}}
  </noscript>

  <script>
    const SUGGESTIONS = [
      "Sunrise 为什么转人工审？",
      "Policy 7.3 要求什么？",
      "收入集中度是多少？",
      "Harbor 的最终结论是什么？"
    ];
    const CAT = {
      risk_classification: "风险分类",
      policy_check: "政策核验",
      final_decision: "最终结论"
    };
    const OUT = {
      high_risk: "高风险",
      standard_risk: "标准风险",
      manual_review_required: "需人工审",
      policy_cleared: "政策通过",
      referred_to_manual_review: "转人工审",
      approved: "通过"
    };
    const NAMES = { A: "A — 审计台", B: "B — 带出处对话", C: "C — 案件简报" };
    const KEYS = ["A", "B", "C"];

    const state = {
      variant: "A",
      apps: [],
      caseId: "",
      messages: [],
      pending: false,
      focus: "",
      openCite: ""
    };

    function esc(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    function nl(value) {
      return esc(value).replace(/\n/g, "<br />");
    }
    function lab(map, key) {
      return map[key] || key || "—";
    }
    function lastAssistant() {
      return [...state.messages].reverse().find((item) => item.role === "assistant" && item.payload);
    }
    function cites(payload) {
      const items = [];
      (payload.decisions || []).forEach((item, i) => {
        items.push({
          id: "d-" + i,
          kind: "决策",
          label: lab(CAT, item.category),
          body: (item.reasoning || item.scenario || "") + " → " + lab(OUT, item.outcome),
          raw: item
        });
      });
      (payload.chunks || []).forEach((item, i) => {
        items.push({
          id: "c-" + i,
          kind: "材料",
          label: (item.kind || "Document") + " · " + (item.application_id || ""),
          body: item.text || "",
          raw: item
        });
      });
      return items;
    }
    function sourceLabel(source) {
      return source === "ollama" ? "Ollama 成文" : "图谱摘录 · 未调用模型";
    }

    function renderA() {
      const latest = lastAssistant();
      const payload = latest ? latest.payload : null;
      const turns = state.messages.map((msg, i) => {
        if (msg.role === "user") {
          return `<div class="a-turn"><div class="a-q">问</div><div class="a-a">${nl(msg.text)}</div></div>`;
        }
        if (msg.pending) {
          return `<div class="a-turn wait">正在从图谱取证…</div>`;
        }
        const chips = cites(msg.payload).map((item) => (
          `<button type="button" data-focus="${item.id}" class="${state.focus === item.id ? "on" : ""}">${esc(item.kind)} ${esc(item.label)}</button>`
        )).join("");
        return `<div class="a-turn">
          <div class="a-q">${esc(sourceLabel(msg.payload.source))}</div>
          <div class="a-a">${nl(msg.payload.answer)}</div>
          <div class="a-cites">${chips}</div>
        </div>`;
      }).join("");
      const evidence = payload ? `
        <div class="a-src">${esc(sourceLabel(payload.source))}</div>
        <h2>决策链</h2>
        ${(payload.decisions || []).map((item, i) => `
          <div class="a-step ${state.focus === "d-" + i ? "hl" : ""}" id="ev-d-${i}">
            <b>${esc(lab(CAT, item.category))} → ${esc(lab(OUT, item.outcome))}</b>
            <p>${esc(item.reasoning || item.scenario || "")}</p>
          </div>`).join("") || "<p class='a-meta'>这次没有决策节点。</p>"}
        <h2>材料</h2>
        ${(payload.chunks || []).map((item, i) => `
          <div class="a-hit ${state.focus === "c-" + i ? "hl" : ""}" id="ev-c-${i}">
            <div class="a-meta">${esc(item.kind)} · ${esc(item.application_id)} · ${esc(item.source || "keyword")}</div>
            <div>${esc(item.text)}</div>
          </div>`).join("") || "<p class='a-meta'>没有命中材料。</p>"}
        <h2>实体</h2>
        ${(payload.entities || []).map((item) => `
          <div class="a-ent">${esc(item.text)} <span class="a-meta">[${esc(item.type)}]</span></div>
        `).join("") || "<p class='a-meta'>没有相关实体。</p>"}
      ` : `<p class="a-empty">左侧提问后，这次回答用到的决策链、材料和实体会钉在这里。模型只写句子，不改图谱。</p>`;
      return `<div class="a">
        <div class="a-top">
          <h1>审计台</h1>
          <nav><a href="/">图谱</a> · <a href="/lending">导入</a> · <a href="/lending/retrieve">检索</a> · <a href="/lending/ontology">本体</a></nav>
        </div>
        <div class="a-grid">
          <section class="a-thread">
            <div class="a-log" data-log>
              ${turns || `<p class="a-empty">把问题写在下面。右侧是卷宗，不是聊天记录。</p>`}
            </div>
            <form class="a-composer" data-form>
              <textarea name="query" required placeholder="Sunrise 为什么转人工审？" ${state.pending ? "disabled" : ""}></textarea>
              <div class="row">
                <span class="a-meta">Enter 发送 · 证据始终在右</span>
                <button type="submit" ${state.pending ? "disabled" : ""}>取证并回答</button>
              </div>
            </form>
          </section>
          <aside class="a-panel">${evidence}</aside>
        </div>
      </div>`;
    }

    function renderB() {
      const log = state.messages.length ? state.messages.map((msg, i) => {
        if (msg.role === "user") {
          return `<div class="b-msg user"><div class="b-bubble">${nl(msg.text)}</div></div>`;
        }
        if (msg.pending) {
          return `<div class="b-msg assistant"><div class="b-bubble wait">正在核对图谱…</div></div>`;
        }
        const key = "m" + i;
        const chips = cites(msg.payload).map((item) => {
          const open = state.openCite === key + item.id;
          return `<button type="button" class="b-cite" data-cite="${key + item.id}" aria-expanded="${open}">${esc(item.label)}</button>
            ${open ? `<div class="b-card">${esc(item.body)}</div>` : ""}`;
        }).join("");
        return `<div class="b-msg assistant"><div class="b-bubble">
          <div class="b-src">${esc(sourceLabel(msg.payload.source))}</div>
          <div>${nl(msg.payload.answer)}</div>
          <div class="b-cites">${chips}</div>
        </div></div>`;
      }).join("") : `<div class="b-hero">
        <h1>问图谱，不信模型</h1>
        <p>先检索决策链和申请材料，再写成一段话。模型不能抽取、推理或落决策。</p>
        <div class="b-chips">${SUGGESTIONS.map((q) => `<button type="button" data-ask="${esc(q)}">${esc(q)}</button>`).join("")}</div>
      </div>`;
      return `<div class="b"><div class="b-shell">
        <div class="b-nav"><a href="/">知识图谱</a> · <a href="/lending">导入案件</a> · <a href="/lending/retrieve">图谱检索</a> · <a href="/lending/ontology">本体</a></div>
        <div class="b-log" data-log>${log}</div>
        <form class="b-composer" data-form>
          <div class="b-box">
            <textarea name="query" rows="1" required placeholder="接着问这张图…" ${state.pending ? "disabled" : ""}></textarea>
            <button type="submit" ${state.pending ? "disabled" : ""}>发送</button>
          </div>
        </form>
      </div></div>`;
    }

    function renderC() {
      const latest = lastAssistant();
      const payload = latest ? latest.payload : null;
      const final = (payload && payload.decisions || []).find((item) => item.category === "final_decision");
      const cases = state.apps.map((app) => {
        const id = app.application_id || app.id;
        return `<button type="button" class="c-case ${state.caseId === id ? "on" : ""}" data-case="${esc(id)}">
          ${esc(app.name)}<small>${esc(id)}</small>
        </button>`;
      }).join("") || `<p class="sub">还没有案件。</p>`;
      const hist = state.messages.filter((item) => item.role === "user").map((item) => (
        `<button type="button" data-ask="${esc(item.text)}">${esc(item.text)}</button>`
      )).join("");
      const body = payload ? `
        <div class="c-hero">
          <div class="c-kicker">${esc(sourceLabel(payload.source))} · ${esc(state.caseId || "图谱")}</div>
          <div class="c-outcome">${esc(lab(OUT, final && final.outcome) || "有证据，无最终结论")}</div>
        </div>
        <div class="c-answer">${nl(payload.answer)}</div>
        <div class="c-chain">${(payload.decisions || []).map((item) => `
          <div class="c-node"><em>${esc(lab(CAT, item.category))}</em>${esc(lab(OUT, item.outcome))}</div>
        `).join("")}</div>
        <table class="c-table">
          <tr><th>来源</th><th>案件</th><th>摘录</th></tr>
          ${(payload.chunks || []).map((item) => `
            <tr><td>${esc(item.kind)}</td><td>${esc(item.application_id)}</td><td>${esc(item.text)}</td></tr>
          `).join("") || "<tr><td colspan='3'>没有命中材料。</td></tr>"}
        </table>
        <div class="c-ents">${(payload.entities || []).map((item) => `<span>${esc(item.text)}</span>`).join("")}</div>
      ` : `<div class="c-empty">选择左侧案件，然后审讯卷宗。每次提问替换这份简报，不堆聊天气泡。</div>`;
      return `<div class="c"><div class="c-layout">
        <aside class="c-rail">
          <h1>案件简报</h1>
          <div class="sub">一次一问 · 结构化卷宗</div>
          ${cases}
          <div class="c-hist">${hist}</div>
        </aside>
        <section class="c-main">
          <div class="c-nav"><a href="/">图谱</a> · <a href="/lending">导入</a> · <a href="/lending/retrieve">检索</a> · <a href="/lending/ontology">本体</a></div>
          ${state.pending ? `<div class="c-empty wait">正在重写简报…</div>` : body}
          <form class="c-cmd" data-form>
            <label>COMMAND</label>
            <div class="c-line">
              <span>›</span>
              <input name="query" required placeholder="${esc(state.caseId ? state.caseId + " 为什么转人工？" : "为什么转人工审？")}" ${state.pending ? "disabled" : ""} />
            </div>
          </form>
        </section>
      </div></div>`;
    }

    const views = { A: renderA, B: renderB, C: renderC };

    function readVariant() {
      const raw = new URLSearchParams(location.search).get("variant") || "A";
      return KEYS.includes(raw) ? raw : "A";
    }

    function setVariant(next) {
      state.variant = next;
      state.focus = "";
      state.openCite = "";
      const url = new URL(location.href);
      url.searchParams.set("variant", next);
      history.replaceState(null, "", url);
      render();
    }

    function scrollLog() {
      const log = document.querySelector("[data-log]");
      if (log) log.scrollTop = log.scrollHeight;
    }

    function bindComposer(root) {
      const form = root.querySelector("[data-form]");
      if (!form) return;
      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const field = form.querySelector("[name=query]");
        ask(field.value);
      });
      const field = form.querySelector("[name=query]");
      if (field && field.tagName === "TEXTAREA") {
        field.addEventListener("keydown", (event) => {
          if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            form.requestSubmit();
          }
        });
      }
    }

    function render() {
      state.variant = readVariant();
      document.getElementById("app").innerHTML = views[state.variant]();
      document.getElementById("switch-name").textContent = NAMES[state.variant];
      document.getElementById("switch-state").textContent =
        "turns " + state.messages.filter((item) => item.role === "user").length +
        " · case " + (state.caseId || "all");
      const root = document.getElementById("app");
      bindComposer(root);
      root.querySelectorAll("[data-ask]").forEach((btn) => {
        btn.addEventListener("click", () => ask(btn.getAttribute("data-ask")));
      });
      root.querySelectorAll("[data-focus]").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.focus = btn.getAttribute("data-focus");
          render();
        });
      });
      root.querySelectorAll("[data-cite]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-cite");
          state.openCite = state.openCite === id ? "" : id;
          render();
        });
      });
      root.querySelectorAll("[data-case]").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.caseId = btn.getAttribute("data-case");
          render();
        });
      });
      scrollLog();
    }

    async function ask(text) {
      let query = (text || "").trim();
      if (!query || state.pending) return;
      if (state.caseId && !query.toLowerCase().includes(state.caseId.toLowerCase()) && !/sunrise|harbor/i.test(query)) {
        query = state.caseId + " " + query;
      }
      state.messages.push({ role: "user", text: query });
      state.messages.push({ role: "assistant", pending: true });
      state.pending = true;
      state.focus = "";
      state.openCite = "";
      render();
      try {
        const response = await fetch("/api/lending/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query })
        });
        const payload = await response.json();
        state.messages.pop();
        state.messages.push({ role: "assistant", payload });
      } catch (err) {
        state.messages.pop();
        state.messages.push({
          role: "assistant",
          payload: { answer: "请求失败：" + err.message, source: "extractive", decisions: [], chunks: [], entities: [] }
        });
      }
      state.pending = false;
      render();
    }

    document.querySelectorAll(".switcher button").forEach((btn) => {
      btn.addEventListener("click", () => {
        const i = KEYS.indexOf(readVariant());
        const next = KEYS[(i + Number(btn.getAttribute("data-dir")) + KEYS.length) % KEYS.length];
        setVariant(next);
      });
    });
    document.addEventListener("keydown", (event) => {
      if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
      const tag = (event.target.tagName || "").toLowerCase();
      if (tag === "input" || tag === "textarea" || event.target.isContentEditable) return;
      const i = KEYS.indexOf(readVariant());
      setVariant(KEYS[(i + (event.key === "ArrowRight" ? 1 : -1) + KEYS.length) % KEYS.length]);
    });

    fetch("/api/lending/applications")
      .then((res) => res.json())
      .then((data) => {
        state.apps = data.applications || [];
        if (!state.caseId && state.apps[0]) state.caseId = state.apps[0].application_id || "";
        render();
      })
      .catch(() => render());

    state.variant = readVariant();
    render();
  </script>
</body>
</html>
