services:
  neo4j:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/neo4j:5-community
    container_name: accountable-lending-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/lending-demo
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  prefect-server:
    build: .
    container_name: accountable-lending-prefect
    command: ["prefect", "server", "start", "--host", "0.0.0.0"]
    ports:
      - "4200:4200"
    environment:
      PREFECT_UI_API_URL: http://localhost:4200/api
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4200/api/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

  prefect-worker:
    build: .
    container_name: accountable-lending-prefect-worker
    command: ["python", "-m", "lending_prefect.worker"]
    depends_on:
      prefect-server:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    volumes:
      - ./exports:/app/exports
      - ./backend:/app/backend
      - ./prefect:/app/prefect
      - ./data:/app/data
      - ./ontology:/app/ontology
    environment:
      SEMANTICA_DISABLE_PROGRESS: "1"
      PYTHONPATH: /app/prefect:/app
      PREFECT_API_URL: http://prefect-server:4200/api
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: lending-demo
      QDRANT_URL: http://qdrant:6333

  qdrant:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/qdrant/qdrant:latest
    container_name: accountable-lending-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:6333/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  ollama:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/ollama/ollama:latest
    container_name: accountable-lending-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  lending-api:
    build: .
    container_name: accountable-lending-api
    command: ["python", "-m", "backend.api"]
    depends_on:
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_started
      ollama:
        condition: service_started
      prefect-server:
        condition: service_healthy
      prefect-worker:
        condition: service_started
    ports:
      - "8001:8001"
    volumes:
      - ./exports:/app/exports
      - ./backend:/app/backend
      - ./prefect:/app/prefect
      - ./frontend:/app/frontend
      - ./data:/app/data
      - ./tests:/app/tests
      - ./pytest.ini:/app/pytest.ini
      - ./ontology:/app/ontology
    environment:
      SEMANTICA_DISABLE_PROGRESS: "1"
      PYTHONPATH: /app/prefect:/app
      LENDING_CORS_ORIGINS: "*"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: lending-demo
      LENDING_API_HOST: "0.0.0.0"
      LENDING_API_PORT: "8001"
      LENDING_REBUILD: ${LENDING_REBUILD:-}
      PREFECT_API_URL: http://prefect-server:4200/api
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-180}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/lending/applications')",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 120s

  lending-ui:
    build:
      context: ./frontend
      dockerfile: lending/Dockerfile
      args:
        VITE_LENDING_API_BASE: ""
        VITE_LENDING_EXPLORER_URL: http://localhost:8000
    container_name: accountable-lending-ui
    depends_on:
      - lending-api
    ports:
      - "8080:80"

  explorer:
    build: .
    container_name: accountable-lending-explorer
    command: ["python", "-m", "backend.admin"]
    depends_on:
      lending-api:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./exports:/app/exports
      - ./backend:/app/backend
    environment:
      SEMANTICA_DISABLE_PROGRESS: "1"
      SEMANTICA_ALLOW_ANONYMOUS: "true"
      EXPLORER_CORS_ORIGINS: "http://localhost:8000,http://127.0.0.1:8000,http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173"
      EXPLORER_HOST: "0.0.0.0"
      EXPLORER_PORT: "8000"

volumes:
  neo4j_data:
  qdrant_data:
  ollama_data:
